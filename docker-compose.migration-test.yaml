services:
  mysql_database:
    image: mysql:9.0.1
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_PORT: 3306 
    volumes:
      - test-migrate-mysql-db:/var/lib/mysql
  
  backend:
    restart: always
    build:
      dockerfile: dockerfile
      context: backend/
    ports:
      - 8080:8080
    environment:
      MYSQL_HOST: project-ad-mysql_database-1
      MEDIA_ROOT: /var/lib/backend/media
    env_file: 
      - path: backend/.env

volumes:
  test-migrate-mysql-db: