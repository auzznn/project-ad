
services:
  mysql_database:
    image: mysql:9.0.1
    restart: always
    ports: 
      - 3306:3306
    env_file: 
      - backend/.env
    volumes:
      - mysql-db:/var/lib/mysql

  backend:
    restart: always
    build:
      dockerfile: dockerfile
      context: backend/
    ports:
      - 8080:8080
    environment:
      MYSQL_HOST: project-ad-mysql_database-1
      MEDIA_ROOT: /var/lib/backend/media
      STATIC_ROOT: /var/lib/backend/static
    env_file: 
      - path: backend/.env
    depends_on:
      - mysql_database
      - redis
    volumes:
      - backend-media:/var/lib/backend/media
      - backend-static:/var/lib/backend/static
  
  redis:
    restart: always
    image: redis/redis-stack:latest
    ports:
      - 6379:6379
      - 8001:8001
    volumes:
      - redis:/var/lib/redis
  
  celery-worker:
    build: 
      dockerfile: dockerfile
      context: backend
    depends_on:
      - backend
      - redis
      - celery-beat
    environment:
      MYSQL_HOST: project-ad-mysql_database-1
      MEDIA_ROOT: /var/lib/backend/media
    entrypoint: celery -A backend worker -E -l info
    volumes:
      - backend-media:/var/lib/backend/media

  celery-beat:
    build: 
      dockerfile: dockerfile
      context: backend
    depends_on:
      - backend
      - redis
    entrypoint: celery -A backend beat -l info

volumes:
  mysql-db:
  backend-media:
  backend-static:
  redis:
