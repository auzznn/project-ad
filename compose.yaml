
services:
  mysql_database:
    image: mysql:9.0.1
    restart: always
    ports: 
      - 3306:3306
    env_file: 
      - backend/.env
    volumes:
      - mysql-db:/var/lib/mysql

  backend:
    restart: always
    build:
      dockerfile: dockerfile
      context: backend/
    ports:
      - 8080:8080
    environment:
      - MYSQL_HOST
    env_file: 
      - path: backend/.env
    depends_on:
      - mysql_database
      - redis
    volumes:
      - backend:/var/lib/backend
  
  redis:
    restart: always
    image: redis/redis-stack:latest
    ports:
      - 6379:6379
      - 8001:8001
    volumes:
      - redis:/var/lib/redis
  
  celery-worker:
    build: 
      dockerfile: dockerfile
      context: backend
    volumes:
      - backend:/var/lib/backend
    depends_on:
      - backend
      - redis
      - celery-beat
    entrypoint: celery -A backend worker -E -l info

  celery-beat:
    build: 
      dockerfile: dockerfile
      context: backend
    volumes:
      - backend:/var/lib/backend
    depends_on:
      - backend
      - redis
    entrypoint: celery -A backend beat -l info

volumes:
  mysql-db:
  backend:
  redis:
